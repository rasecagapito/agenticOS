name: router-check

on:
  push:
    paths:
      - "template/E-roteador/**"
      - "scripts/install-router.mjs"
      - "scripts/check-agents-sync.sh"
      - "scripts/tests/**"
  pull_request:
    paths:
      - "template/E-roteador/**"
      - "scripts/install-router.mjs"
      - "scripts/check-agents-sync.sh"
      - "scripts/tests/**"

jobs:
  check-router:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agentes sincronizados + testes do roteador
        run: node template/E-roteador/.claude/router/emit-agents.mjs --check && node --test scripts/tests/router.test.mjs
